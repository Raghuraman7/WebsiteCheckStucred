name: Uptime Monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # Every 15 minutes 24/7
  workflow_dispatch:           # Manual trigger from GitHub UI
  push:
    branches:
      - main                  # Also runs on every commit (keeps workflow active)

jobs:
  monitor:
    name: Check Sites & API
    runs-on: ubuntu-latest
    timeout-minutes: 4        # Kill if stuck — safely under 15 min window
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run uptime monitor
        env:
          SMTP_HOST:    ${{ secrets.SMTP_HOST }}
          SMTP_PORT:    ${{ secrets.SMTP_PORT }}
          SMTP_SECURE:  ${{ secrets.SMTP_SECURE }}
          SMTP_USER:    ${{ secrets.SMTP_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
        run: node monitor.js
